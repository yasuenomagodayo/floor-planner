<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>間取り図プランナー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>間取り図プランナー</h1>

<!-- STEP1 -->
<div class="step" id="step1">
  <h2>STEP 1：間取り図アップロード / プロジェクト読み込み</h2>

  <input type="file" id="floorImageInput" accept="image/*">

  <input type="file" id="loadProjectInputStep1" accept="application/json">
  <label for="loadProjectInputStep1" class="fileLabel">プロジェクト読み込み</label>

  <button id="goStep2" class="nextBtn" disabled>次へ（STEP2へ）</button>
</div>

<!-- STEP2 -->
<div class="step" id="step2" style="display:none;">
  <h2>STEP 2：縮尺設定</h2>
  <button id="setScaleBtn">縮尺を設定する</button>
  <div id="scaleInfo">まだ縮尺は設定されていません。</div>

  <button id="backToStep1" class="backBtn">戻る</button>
  <button id="goStep3" class="nextBtn" disabled>次へ（STEP3へ）</button>
</div>

<!-- STEP3 -->
<div class="step" id="step3" style="display:none;">
  <h2>STEP 3：家具追加・編集</h2>

  <!-- 家具追加パネル（横スクロール） -->
  <div id="furniturePanel">
    <button class="addBtn" data-type="bed">ベッド</button>
    <button class="addBtn" data-type="sofa">ソファ</button>
    <button class="addBtn" data-type="desk">机</button>
    <button class="addBtn" data-type="chair">椅子</button>
    <button class="addBtn" data-type="fridge">冷蔵庫</button>
    <button class="addBtn" data-type="washer">洗濯機</button>
    <button id="addCustomBtn">自作家具</button>
  </div>

  <!-- 操作ボタン -->
  <div id="actionPanel">
    <button id="deleteSelectedBtn" class="dangerBtn" disabled>削除</button>
    <button id="saveImageBtn">画像保存</button>
    <button id="shareImageBtn">共有</button>
    <button id="saveProjectBtn">プロジェクト保存</button>

    <input type="file" id="loadProjectInput" accept="application/json">
    <label for="loadProjectInput" class="fileLabel">読み込み</label>
  </div>
</div>

<!-- キャンバス -->
<canvas id="floorCanvas"></canvas>

<script src="app.js"></script>
</body>
</html>
