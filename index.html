<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Floor Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>間取り図アップロード</h2>
<input type="file" id="floorImageInput" accept="image/*">

<h2>家具パレット</h2>
<div id="palette">
  <button class="palette-item" data-type="chair">椅子</button>
  <button class="palette-item" data-type="table">机</button>
  <button class="palette-item" data-type="bed">ベッド</button>
  <button class="palette-item" data-type="fridge">冷蔵庫</button>
  <button class="palette-item" data-type="washer">洗濯機</button>
</div>

<h2>家具の色</h2>
<input type="color" id="colorPicker" value="#888888">

<h2>キャンバス</h2>
<canvas id="floorCanvas"></canvas>

<script src="app.js"></script>
</body>
</html>
