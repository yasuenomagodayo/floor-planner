<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>間取り図プランナー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>間取り図プランナー</h1>

<!-- STEP 1 -->
<div class="step" id="step1">
  <h2>STEP 1：間取り図アップロード / プロジェクト読み込み</h2>

  <input type="file" id="floorImageInput" accept="image/*">

  <input type="file" id="loadProjectInputStep1" accept="application/json">
  <label for="loadProjectInputStep1" class="fileLabel">プロジェクト読み込み</label>

  <button id="goStep2" class="nextBtn" disabled>次へ（STEP2へ）</button>
</div>

<!-- STEP 2 -->
<div class="step" id="step2" style="display:none;">
  <h2>STEP 2：縮尺を設定</h2>
  <button id="setScaleBtn">縮尺を設定する</button>
  <div id="scaleInfo">まだ縮尺は設定されていません。</div>

  <button id="backToStep1" class="backBtn">戻る</button>
  <button id="goStep3" class="nextBtn" disabled>次へ（STEP3へ）</button>
</div>

<!-- STEP 3 -->
<div class="step" id="step3" style="display:none;">
  <h2>STEP 3：家具追加・編集</h2>

  <h3>家具の色</h3>
  <input type="color" id="colorPicker" value="#888888">

  <h3>ベッド（日本サイズ）</h3>
  <select id="bedSizeSelect">
    <option value="single">シングル（970×1950mm）</option>
    <option value="semi">セミダブル（1200×1950mm）</option>
    <option value="double">ダブル（1400×1950mm）</option>
  </select>
  <button id="addBedBtn">ベッドを追加</button>

  <h3>ソファ</h3>
  <select id="sofaSeatSelect">
    <option value="1">1人掛け（800×800mm）</option>
    <option value="2">2人掛け（1400×800mm）</option>
    <option value="3">3人掛け（1800×800mm）</option>
  </select>
  <button id="addSofaBtn">ソファを追加</button>

  <h3>その他の家具</h3>
  <button class="presetBtn" data-type="desk">机（1200×600mm）</button>
  <button class="presetBtn" data-type="studyDesk">勉強机（1000×600mm）</button>
  <button class="presetBtn" data-type="chair">椅子（400×400mm）</button>
  <button class="presetBtn" data-type="fridgeSmall">冷蔵庫（小：480×600mm）</button>
  <button class="presetBtn" data-type="fridgeLarge">冷蔵庫（大：600×700mm）</button>
  <button class="presetBtn" data-type="washer">洗濯機（600×600mm）</button>

  <h3>自作家具</h3>
  <label>名前：</label>
  <input type="text" id="customName"><br>
  <label>幅(mm)：</label>
  <input type="number" id="customWidthMm"><br>
  <label>奥行(mm)：</label>
  <input type="number" id="customHeightMm"><br>
  <label>色：</label>
  <input type="color" id="customColor" value="#888888"><br>
  <button id="addCustomFurnitureBtn">追加</button>

  <h3>選択中の家具操作</h3>
  <button id="deleteSelectedBtn" class="dangerBtn" disabled>選択中の家具を削除</button>

  <h3>保存・読み込み</h3>
  <button id="saveImageBtn">画像として保存（PNG）</button>
  <button id="saveProjectBtn">プロジェクト保存（JSON）</button>

  <input type="file" id="loadProjectInput" accept="application/json">
  <label for="loadProjectInput" class="fileLabel">プロジェクト読み込み（JSON）</label>

  <button id="backToStep2" class="backBtn">戻る（STEP2へ）</button>
</div>

<h2>キャンバス</h2>
<canvas id="floorCanvas"></canvas>

<!-- 縮尺入力ダイアログ -->
<div id="scaleInputDialog">
  <h3>線の長さ(mm)を入力</h3>
  <input type="number" id="scaleInputMm" placeholder="例：1950">
  <button id="scaleInputOk">OK</button>
  <button id="scaleInputCancel">キャンセル</button>
</div>

<script src="app.js"></script>
</body>
</html>
