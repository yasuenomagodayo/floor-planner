<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>間取り図プランナー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>間取り図プランナー</h1>

<!-- STEP 1 -->
<div class="step" id="step1">
  <h2>STEP 1：間取り図アップロード / プロジェクト読み込み</h2>

  <input type="file" id="floorImageInput" accept="image/*">

  <input type="file" id="loadProjectInputStep1" accept="application/json">
  <label for="loadProjectInputStep1" class="fileLabel">プロジェクト読み込み</label>

  <button id="goStep2" class="nextBtn" disabled>次へ（STEP2へ）</button>
</div>

<!-- STEP 2 -->
<div class="step" id="step2" style="display:none;">
  <h2>STEP 2：縮尺を設定</h2>
  <button id="setScaleBtn">縮尺を設定する</button>
  <div id="scaleInfo">まだ縮尺は設定されていません。</div>

  <button id="backToStep1" class="backBtn">戻る</button>
  <button id="goStep3" class="nextBtn" disabled>次へ（STEP3へ）</button>
</div>

<!-- STEP 3 -->
<div class="step" id="step3" style="display:none;">
  <h2>STEP 3：家具追加・編集</h2>

  <h3>家具の色</h3>
  <input type="color" id="colorPicker" value="#888888">

  <h3>ベッド（日本サイズ）</h3>
  <select id="bedSizeSelect">
    <option value="single">シングル（970×1950mm）</option>
    <option value="semi">セミダブル（1200×1950mm）</option>
    <option value="double">ダブル（1400×1950mm）</option>
  </select>
  <button id="addBedBtn">ベッドを追加</button>

  <h3>ソファ</h3>
  <select id="sofaSeatSelect">
    <option value="1">1人掛け（800×800mm）</option>
    <option value="2">2人掛け（1400×800mm）</option>
    <option value="3">3人掛け（1800×800mm）</option>
  </select>
  <button id="addSofaBtn">ソファを追加</button>

  <h3>その他の家具</h3>
  <button class="presetBtn" data-type="desk">机（1200×600mm）</button>
  <button class="presetBtn" data-type="studyDesk">勉強机（1000×600mm）</button>
  <button class="presetBtn" data-type="chair">椅子（400×400mm）</button>
