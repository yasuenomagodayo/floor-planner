<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Floor Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>間取り図プランナー</h1>

<!-- STEP 1 -->
<div class="step" id="step1">
  <h2>STEP 1：間取り図をアップロード</h2>
  <input type="file" id="floorImageInput" accept="image/*">
  <button id="goStep2" class="nextBtn" disabled>次へ</button>
</div>

<!-- STEP 2 -->
<div class="step" id="step2" style="display:none;">
  <h2>STEP 2：縮尺を設定（赤点・赤線で表示）</h2>
  <button id="setScaleBtn">縮尺を設定する（線を2点クリック）</button>
  <div id="scaleInfo">まだ縮尺は設定されていません。</div>
  <button id="goStep3" class="nextBtn" disabled>次へ</button>
</div>

<!-- STEP 3 -->
<div class="step" id="step3" style="display:none;">
  <h2>STEP 3：家具を追加・操作</h2>

  <h3>家具の基本色</h3>
  <input type="color" id="colorPicker" value="#888888">

  <h3>ベッド（日本サイズ）</h3>
  <select id="bedSizeSelect">
    <option value="single">シングル（970×1950mm）
